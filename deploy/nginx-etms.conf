# ETMS — Employee Training Management System
#
# Paste these two blocks into the server{} block that already serves
# replportal.co.in on the production host. Find it with:
#
#     nginx -T | grep -n -A5 'server_name replportal.co.in'
#
# then `nginx -t && systemctl reload nginx`.
#
# ETMS is deliberately independent of the dashboard hub ecosystem — it has its
# own login and its own roles — so it is kept in this file rather than added to
# the fleet's nginx-dashboards.conf.

location = /etms { return 301 /etms/; }

location /etms/ {
    # The trailing /etms/ is required. nginx must NOT strip the prefix: the app
    # is built with basePath and assetPrefix both set to "/etms", so the path is
    # compiled into the server manifest and the client bundle. Proxying to
    # http://127.0.0.1:3020/ instead would 404 every route and every asset.
    proxy_pass http://127.0.0.1:3020/etms/;

    # Training videos. nginx defaults client_max_body_size to 1m, which rejects
    # a video upload with a 413 before it ever reaches the app — and the app is
    # already configured for 1GB at both hops after this one
    # (proxyClientMaxBodySize in next.config.mjs, and
    # spring.servlet.multipart.max-request-size=1024MB in the backend), so
    # without this the limit here is the one that silently wins.
    client_max_body_size    1024m;
    client_body_timeout     300s;

    # Stream the upload straight through instead of spooling the whole file to
    # disk on the proxy first, and allow a slow large upload to outlive the
    # default 60s read/send timeouts.
    proxy_request_buffering off;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# No block is needed for the backend. The browser calls /etms/api/..., which the
# Next.js server rewrites to ETMS_BACKEND_ORIGIN container-side — that hop never
# passes through nginx, and port 8096 is not exposed publicly.
